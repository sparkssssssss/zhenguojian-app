name: Build android v7a packages

on:
  workflow_dispatch:
    inputs:
      edition:
        description: '构建版本'
        type: choice
        default: both
        options:
          - both
          - hongguojian
          - zhenguojian

permissions:
  contents: read

concurrency:
  group: android-v7a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOSUMDB: sum.golang.org

jobs:
  android-v7a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - edition: hongguojian
            arguments: ''
          - edition: zhenguojian
            arguments: '--all-sources'
    if: ${{ github.event.inputs.edition == 'both' || github.event.inputs.edition == matrix.edition }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version-file: native/go.mod
          cache-dependency-path: native/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install Android NDK
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses > /dev/null
          set -o pipefail
          "$sdkmanager" 'ndk;28.2.13676358'
      - name: Configure Android signing
        run: python scripts/configure_signing.py
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - run: python scripts/build_android.py --abi armeabi-v7a ${{ matrix.arguments }}
      - name: Remove signing files
        if: always()
        run: python scripts/configure_signing.py --clean
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.edition }}-android-armeabi-v7a
          path: dist/android/*
          if-no-files-found: error
          retention-days: 14
